[general]
framerate = 24
autosens = 1
sensitivity = 100
bars = 8
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 3

[input]
method = pulse
source = auto

[output]
method = raw
channels = stereo
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
