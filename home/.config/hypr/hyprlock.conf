$displayFont = SF Pro Display
$textFont = SF Pro Text
$monoFont = SF Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/mono-dark-distortion.png
    color = rgba(0, 0, 0, 1.0)
}

label {
    monitor =
    text = $TIME
    color = rgb(237, 237, 237)
    font_size = 72
    font_family = $displayFont
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(102, 102, 102)
    font_size = 16
    font_family = $textFont
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    inner_color = rgb(10, 10, 10)
    outer_color = rgb(237, 237, 237)
    check_color = rgb(70, 167, 88)
    fail_color = rgb(229, 72, 77)
    font_color = rgb(237, 237, 237)
    font_family = $monoFont
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    rounding = 8
    dots_spacing = 0.3
    position = 0, -70
    halign = center
    valign = center
}
